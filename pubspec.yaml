name: luxihub_user
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  bloc: ^9.2.0
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.8
  get_it: ^8.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_map: ^8.1.1
  flutter_rating_bar: ^4.0.1
  flutter_polyline_points: ^2.0.1
  flutter_stripe: ^11.4.0
  google_maps_flutter: ^2.10.0
  latlong2: ^0.9.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.1.0
  geolocator: ^13.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.12.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  package_rename: ^1.10.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

package_rename_config:
  android:
    app_name: "LuxiHub" # Display name
    package_name: "com.luxihub.user_app"

  ios:
    app_name: "LuxiHub" # Display name
    bundle_name: "LuxiHub" # Bundle name
    package_name: "com.luxihub.user_app" # Product Bundle Identifier
  # ... other platforms